[package]
name = "spelunk-core"
version = "0.8.3"
edition = "2024"
description = "Core library for spelunk — storage, indexer, search, embeddings"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"

[features]
default = []
rich-formats = ["dep:lopdf", "dep:docx-rs", "dep:calamine"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
reqwest = { workspace = true }
thiserror = "2"
percent-encoding = "2.3"

toml = "1.1"
dirs = "6"

gix = { version = "0.84.0", default-features = false, features = [
    "sha1",
    "status",
] }
gix-pack = ">=0.69.0"
gix-fs = ">=0.21.1"
gix-transport = ">=0.56.0"

tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-proto = "0.4"
tree-sitter-sequel = "0.3"

uuid = { workspace = true }
regex = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
ignore = "0.4"
indicatif = "0.18"

docx-rs = { version = "0.4", optional = true }
calamine = { version = "0.35", features = ["dates"], optional = true }
lopdf = { version = "0.42", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
