[package]
name = "spelunk-server"
version = "0.9.7"
edition = "2024"
description = "spelunk shared memory server"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"

[[bin]]
name = "spelunk-server"
path = "src/main.rs"

[lib]
name = "spelunk_server"
path = "src/lib.rs"

[features]
default = ["embed-native"]
# embed-native: bundle the F2LLM-v2-330M Qwen3 embedder (candle, CPU). The
# inference engine lives in the `spelunk-embed` crate (local-path load only);
# this crate additionally owns the Hugging Face Hub acquisition path
# (`embed_hub` module) that resolves the model artifacts before handing them
# to `spelunk-embed`'s `load_from_path`. Enables the optional `spelunk-embed`
# dep; disable this feature for an external-endpoint-only server (no candle).
embed-native = ["dep:spelunk-embed", "dep:candle-core", "dep:hf-hub", "dep:dirs"]
# metal: enable Metal GPU acceleration on macOS. Add this when building the
# macOS binary. Forwards to `spelunk-embed`'s `metal` feature.
metal = ["spelunk-embed/metal"]

[dependencies]
spelunk-core = { path = "../spelunk-core" }
spelunk-embed = { path = "../spelunk-embed", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
axum-server = { workspace = true }
# In-process TLS (ADR-066): needed only to install the `ring` CryptoProvider as
# the process default at startup.
rustls = { workspace = true }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["auth", "timeout", "limit"] }
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive", "env"] }
regex = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
constant_time_eq = "0.5"
# Physical core count for the embed CPU-thread budget (main.rs). Not gated by
# embed-native: the budget is resolved before the runtime starts regardless of
# feature set. Pinned here since no other crate uses it directly.
num_cpus = "1"
# Hugging Face Hub acquisition path for the bundled native embedder
# (`embed_hub` module) — the only place in the workspace that depends on
# `hf-hub`. Gated behind `embed-native` so a build without that feature
# carries none of this. Pinned directly here (not in [workspace.dependencies])
# since no other crate uses it.
candle-core = { workspace = true, optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "ureq", "rustls-tls"], optional = true }
dirs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
# Builds a minimal-but-valid tokenizer.json fixture for embed_hub's
# corrupt-GGUF test, so it exercises the GGUF parse path instead of failing
# earlier on tokenizer parsing like the corrupt-tokenizer test.
tokenizers = { workspace = true }
