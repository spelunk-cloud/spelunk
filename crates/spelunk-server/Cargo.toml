[package]
name = "spelunk-server"
version = "0.9.0"
edition = "2024"
description = "spelunk shared memory server"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"

[[bin]]
name = "spelunk-server"
path = "src/main.rs"

[lib]
name = "spelunk_server"
path = "src/lib.rs"

[features]
default = ["embed-native"]
# embed-native: bundle the F2LLM-v2-330M Qwen3 embedder via candle (CPU).
embed-native = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
# metal: enable Metal GPU acceleration on macOS. Add this when building the macOS binary.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
spelunk-core = { path = "../spelunk-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["auth"] }
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive", "env"] }
regex = { version = "1", default-features = false, features = ["std"] }
dirs = "6"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
hf-hub = { version = "0.5", optional = true }
tokenizers = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "5", features = ["axum_extras"] }
