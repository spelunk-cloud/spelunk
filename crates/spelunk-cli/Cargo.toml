[package]
name = "spelunk-cli"
version = "0.9.5"
edition = "2024"
description = "spelunk — AI agent context retrieval CLI"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"
homepage = "https://github.com/spelunk-cloud/spelunk"
keywords = [
    "code-search",
    "semantic-search",
    "tree-sitter",
    "ai-agents",
    "embeddings",
]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[features]
rich-formats = ["spelunk-core/rich-formats"]

[[bin]]
name = "spelunk"
path = "src/main.rs"

[dependencies]
spelunk-core = { path = "../spelunk-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
uuid = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
gethostname = "1"
indicatif = "0.18"
futures-util = "0.3"
ignore = "0.4"
reqwest = { workspace = true }
# Named directly so `capability.rs` can downcast a probe failure's error
# chain to `rustls::Error`/`CertificateError` and classify TLS trust failures
# separately from a transport-level unreachable. Same resolved version as
# reqwest's own rustls-tls stack (workspace-pinned); no crypto operations of
# our own, so features only need to satisfy the enum types compiling.
rustls = { workspace = true }
percent-encoding = "2.3"
blake3 = "1"
regex = { version = "1", default-features = false, features = ["std"] }
dirs = { workspace = true }
gix = { version = "0.86.0", default-features = false, features = [
    "sha1",
    "status",
] }
gix-pack = ">=0.69.0"
gix-fs = ">=0.21.1"
gix-transport = ">=0.56.0"
tempfile = { workspace = true }

[dev-dependencies]
# test-support exposes spelunk-core's in-memory secret-store double
# (config::secret_store::MemoryStore) so unit tests inject it instead of
# hitting the real OS keychain. Dev-only: not enabled for release builds.
spelunk-core = { path = "../spelunk-core", features = ["test-support"] }
assert_cmd = "2.2"
predicates = "3.1"
# Upgrade-corpus fixtures only. The captured databases are mostly the vec0
# extension's preallocated vector chunk, which is zeros: gzip takes them from
# megabytes to tens of kilobytes, small enough to check in. Already in the
# lockfile as a transitive dependency, so this adds no new supply-chain surface.
flate2 = "1"
# Upgrade-corpus fixtures only: verifies each checked-in wing still hashes to
# the artifact its recorded expectations were captured from. Same version
# spelunk-core already depends on, so it adds nothing to the lockfile.
sha2 = "0.11"
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
# TLS-trust e2e test only: an in-test axum-server TLS listener plus rcgen-generated
# CA/leaf certs, to exercise the CLI's real client path against a proper chain and
# against the classic CA-cert-as-leaf misconfiguration.
axum = { version = "0.8", features = ["macros"] }
axum-server = { workspace = true }
rcgen = "0.14"
# ADR-037 P2 relay tests only: runs the real spelunk-server axum router
# in-process (`spelunk_server::router`) to exercise `outbox.rs`'s local relay
# client against the actual `/local/relay/push`/`/local/relay/poll` wire
# shapes, not a hand-mocked stand-in. `default-features = false` skips the
# native embedder (candle/hf-hub) build, irrelevant to these tests.
spelunk-server = { path = "../spelunk-server", default-features = false }
