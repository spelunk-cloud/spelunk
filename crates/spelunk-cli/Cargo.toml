[package]
name = "spelunk-cli"
version = "0.8.3"
edition = "2024"
description = "spelunk — AI agent context retrieval CLI"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"
homepage = "https://github.com/spelunk-cloud/spelunk"
keywords = [
    "code-search",
    "semantic-search",
    "tree-sitter",
    "ai-agents",
    "embeddings",
]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[features]
rich-formats = ["spelunk-core/rich-formats"]

[[bin]]
name = "spelunk"
path = "src/main.rs"

[dependencies]
spelunk-core = { path = "../spelunk-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
uuid = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
gethostname = "1"
indicatif = "0.18"
futures-util = "0.3"
ignore = "0.4"
reqwest = { workspace = true }
openssl = { workspace = true }
percent-encoding = "2.3"
blake3 = "1"
regex = { version = "1", default-features = false, features = ["std"] }
dirs = "6"
gix = { version = "0.84.0", default-features = false, features = [
    "sha1",
    "status",
] }
gix-pack = ">=0.69.0"
gix-fs = ">=0.21.1"
gix-transport = ">=0.56.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
