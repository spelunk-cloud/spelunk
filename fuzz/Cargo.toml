[package]
name = "spelunk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the fuzz crate out of the root Cargo workspace. cargo-fuzz walks up the
# directory tree and would otherwise treat this manifest as a stray member of
# the workspace at ../Cargo.toml, which fails the build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.spelunk-core]
path = "../crates/spelunk-core"

# Disable LTO for faster fuzzer builds.
[profile.release]
lto = false
codegen-units = 4

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_secret_scanner"
path = "fuzz_targets/fuzz_secret_scanner.rs"
test = false
doc = false

[[bin]]
name = "fuzz_chunker"
path = "fuzz_targets/fuzz_chunker.rs"
test = false
doc = false

[[bin]]
name = "fuzz_escape_xml"
path = "fuzz_targets/fuzz_escape_xml.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jsonl_parse"
path = "fuzz_targets/fuzz_jsonl_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cli_history_entry"
path = "fuzz_targets/fuzz_cli_history_entry.rs"
test = false
doc = false
