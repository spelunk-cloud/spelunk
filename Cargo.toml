[workspace]
members = [
    "crates/spelunk-core",
    "crates/spelunk-cli",
    "crates/spelunk-embed",
    "crates/spelunk-export",
    "crates/spelunk-server",
]
resolver = "2"

[workspace.dependencies]
anyhow      = "1"
async-trait = "0.1"
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror   = "2"
rusqlite    = { version = "0.40", features = ["bundled"] }
sqlite-vec  = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# In-process HTTPS for spelunk-server (ADR-066). `tls-rustls-no-provider` avoids
# rustls' default aws-lc-rs provider (needs cmake/C/NASM); ring is installed at
# startup instead — already the resolved provider via reqwest/hf-hub.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# Named directly (not just pulled in transitively via reqwest/axum-server) so
# spelunk-cli can match on `rustls::Error`/`CertificateError` variants when
# classifying a probe failure. default-features off keeps aws-lc-rs out of the
# tree; `ring`/`tls12` match the provider already resolved via reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
uuid        = { version = "1", features = ["v4", "v7", "serde"] }
tempfile    = "3"
pretty_assertions = "1"
serial_test = "4"
wiremock    = "0.6"
dirs        = "6"
# Native embedder stack (F2LLM-v2-330M via candle). Optional deps of the
# `spelunk-embed` crate, gated behind its default-on `native` feature; versions
# pinned here so the candle pair stays on one runtime line. No candle-transformers:
# see the `Config`/`repeat_kv` doc comment in spelunk-embed/src/embedder_native.rs.
candle-core = "0.11.0"
candle-nn   = "0.11.0"
tokenizers  = "0.23"
# OS keychain for the CLI bearer credential (macOS Keychain, Linux Secret
# Service via zbus, Windows Credential Manager). `v1` is keyring 4's
# compatibility shim: same Entry::new/get_password/set_password/
# delete_credential/Error::NoEntry surface as v3, bundling
# apple-native-keyring-store + windows-native-keyring-store +
# zbus-secret-service-keyring-store (replaces v3's dbus-based backend; already
# builds with its own crypto-rust feature, so no separate crypto feature is
# needed here).
keyring     = { version = "4", default-features = false, features = ["v1"] }

[profile.release]
lto           = true
codegen-units = 1
opt-level     = 3
# Only the release workflow's Linux job stripped binaries (a manual `strip`
# step after build); macOS and Windows release artifacts, and any local
# `cargo build --release`, shipped full symbol tables. This applies uniformly.
strip         = true
