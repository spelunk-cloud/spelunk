name: Stability contract

# Enforces docs/stability.md. The general `test` job in ci.yml already runs
# these test binaries as part of the whole suite; this job runs them alone so a
# contract break is a named, unambiguous failure rather than one red line in a
# thousand-test run, and so the reason is legible to whoever opened the PR.
#
# The `/v1/` half of the contract is enforced by the `openapi-snapshot` job in
# ci.yml, which regenerates the spec from the running binary and diffs it
# against docs/openapi.json. It is deliberately not duplicated here: a second
# copy would burn a full server build for no extra signal.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The OS keychain is unavailable in headless runners and blocks on macOS.
  # Every spawned CLI under test inherits this, so none of them reach for it.
  SPELUNK_SECRET_STORE: file

jobs:
  plumbing-contract:
    name: Plumbing JSONL schema and exit codes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      # Runs first: if the checker itself stopped rejecting anything, the two
      # jobs below would pass while guaranteeing nothing.
      - name: Schema checker accepts additions and rejects removals
        run: cargo test -p spelunk-cli --test schema_contract_checker

      - name: Plumbing JSONL output matches the committed schema
        run: cargo test -p spelunk-cli --test plumbing_jsonl_contract

      - name: Plumbing exit codes follow the 0/1/2 convention
        run: cargo test -p spelunk-cli --test plumbing_exit_codes
