name: Fuzz

on:
  schedule:
    # Run weekly on Monday at 09:00 UTC (after the security scan at 08:00).
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Deny by default; the job below only checks out and uploads its own crash
# artifacts on failure, neither of which needs write access to the repo.
permissions: {}

jobs:
  fuzz-parser:
    name: cargo-fuzz fuzz_parser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The fuzz crate is a standalone workspace (fuzz/Cargo.toml has its own
      # empty [workspace]) with its own Cargo.lock, which drifts from the main
      # workspace and can pin dependency versions that no longer compile on the
      # current toolchain (e.g. gix-hash 0.25.1). Seed it from the workspace lock
      # so cargo-fuzz's minimal resolve reuses exactly the versions the project
      # uses for every shared package, only adding the fuzz-only crates.
      - name: Align fuzz lockfile with the workspace
        run: cp Cargo.lock fuzz/Cargo.lock

      # The fuzz targets link spelunk-core, which pulls keyring's
      # sync-secret-service backend (libdbus-sys); without this its build script
      # fails when pkg-config can't find dbus-1. Every Linux job in ci.yml
      # installs the same package for this reason.
      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust nightly
        run: |
          rustup update nightly
          rustup default nightly

      - name: Cache cargo registry and binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo-fuzz --version 2>/dev/null || cargo +nightly install cargo-fuzz --locked

      # LeakSanitizer suppressions (fuzz/lsan.suppressions) are matched against
      # symbolized frames, so a working llvm-symbolizer must be discoverable;
      # otherwise leak stacks stay raw and the suppression cannot match.
      - name: Ensure leak-stack symbolization
        run: |
          SYM="$(command -v llvm-symbolizer || ls /usr/bin/llvm-symbolizer* /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SYM" ]; then
            sudo apt-get update && sudo apt-get install -y llvm
            SYM="$(ls /usr/bin/llvm-symbolizer* | sort -V | tail -1)"
          fi
          echo "Using symbolizer: $SYM"
          echo "ASAN_SYMBOLIZER_PATH=$SYM" >> "$GITHUB_ENV"
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/fuzz/lsan.suppressions" >> "$GITHUB_ENV"

      - name: Run fuzzer (60 s)
        run: cargo +nightly fuzz run fuzz_parser -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/fuzz_parser/
