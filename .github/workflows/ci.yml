name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Force the file-backed secret store in all CI runs. The OS keychain
  # (macOS Keychain / Linux Secret Service) is not available in headless
  # runners: on Linux, libdbus-sys is present but the Secret Service daemon
  # isn't running; on macOS, Keychain.app prompts for authorisation and
  # blocks indefinitely. The file store is the correct CI fallback and is
  # explicitly tested as a first-class path in spelunk-core's secret_store
  # tests. Integration tests (backend_kind_diagnostic) inherit this env var
  # automatically via the cargo test subprocess.
  SPELUNK_SECRET_STORE: file

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # clippy/check/build in this job need no debug info from the dev
      # profile; the full workspace build (all-targets, rich-formats, incl.
      # the embedder dep tree) has been observed to exhaust runner disk
      # (ENOSPC) with debug info on. Mirrors CARGO_PROFILE_TEST_DEBUG below.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Disk usage (baseline)
        run: df -h

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Disk usage (after cache restore)
        run: df -h

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (rich-formats)
        run: cargo clippy --all-targets --features rich-formats -- -D warnings

      - name: Check (rich-formats)
        run: cargo check --all-targets --features rich-formats

      - name: Build (rich-formats)
        run: cargo build --all-targets --features rich-formats

      - name: Disk usage (after build)
        if: always()
        run: df -h

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Test binaries don't need full debug info; this shrinks compile times
      # and cache size for this job without affecting check/build.
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux builds the native embedder (candle F2LLM) so the
            # `embed-native` path stays under test on at least one platform.
            test-flags: ""
          - os: macos-latest
            # macOS drops the server's `embed-native` feature: this builds the
            # external-endpoint-only server (no hf-hub download path, no candle
            # in spelunk-server) and keeps that config under test. Note candle is
            # now an unconditional dep of the spelunk-embed crate, so its native
            # embedder still compiles here as a workspace member. The embedder is
            # EXPERIMENTAL / NOT RECOMMENDED.
            test-flags: "--no-default-features"
          - os: windows-latest
            # Windows keeps default features: the embed-native default builds
            # the candle (CPU) embedder, which links cleanly. The spelunk-server
            # tests use embedder: None and never load the model.
            test-flags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      # One command per step: this job's matrix includes windows-latest, and a
      # Windows step's exit status does not reflect a failing native
      # executable (only a failing PowerShell cmdlet), so chaining two rustup
      # invocations in one run block would mask a failure in the first.
      - name: Update stable toolchain
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `-v2` bump abandons the poisoned pre-2026-06-24 macOS caches that
          # held stale native-embedder link directives. Keep restore-keys on the
          # same `-v2-` prefix so we never fall back into a poisoned cache.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run ${{ matrix.test-flags }}

      - name: Run doctests
        run: cargo test --doc ${{ matrix.test-flags }}

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The packaging scripts only otherwise run at release-tag time, where a
      # break is expensive. node:test is a builtin: nothing to install.
      - name: Test packaging scripts
        run: node --test .github/scripts/write-deb-control.test.js

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    # The image compiles the release server (candle embedder) from scratch with
    # no cargo cache, so allow a generous ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spelunk-server:ci .

      # Assert the image ships the REAL server, not a placeholder: a no-op
      # binary exits 0 on every flag, so check for actual OUTPUT. Running the
      # binary also resolves every NEEDED shared lib at load, guarding the
      # runtime stage's lib set (a `docker build` alone never runs it).
      - name: Smoke-test the image
        run: |
          test -n "$(docker run --rm spelunk-server:ci --version)"
          docker run --rm spelunk-server:ci --print-openapi | head -c1 | grep -q .

  openapi-snapshot:
    name: OpenAPI snapshot check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate OpenAPI spec
        run: cargo run -p spelunk-server -- --print-openapi > /tmp/openapi-generated.json

      - name: Diff against committed snapshot
        run: |
          if ! diff -w -u docs/openapi.json /tmp/openapi-generated.json; then
            echo ""
            echo "ERROR: docs/openapi.json is out of date."
            echo "Run: cargo run -p spelunk-server -- --print-openapi > docs/openapi.json"
            echo "Then commit the updated snapshot."
            exit 1
          fi

  internal-id-guard:
    name: Internal board-id guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard needs the base ref (PR) or previous ref (push) present
          # locally to diff against; a shallow checkout wouldn't have it.
          fetch-depth: 0

      - name: Run guard self-tests
        run: bash .github/scripts/check-internal-ids.test.sh

      - name: Scan the introduced commits for internal board-id references
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}...${{ github.event.after }}"
          else
            # First push of a new branch: no meaningful "before". Fall back
            # to just the tip commit rather than skipping the check.
            range="${{ github.sha }}~1...${{ github.sha }}"
          fi
          .github/scripts/check-internal-ids.sh --range "$range"
