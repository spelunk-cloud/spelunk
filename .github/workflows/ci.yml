name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Deny by default; every job below grants only what it needs. None of these
# jobs push commits, comment on PRs, or create releases, so `contents: read`
# (checkout only) covers all of them.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Force the file-backed secret store in all CI runs. The OS keychain
  # (macOS Keychain / Linux Secret Service) is not available in headless
  # runners: on Linux, libdbus-sys is present but the Secret Service daemon
  # isn't running; on macOS, Keychain.app prompts for authorisation and
  # blocks indefinitely. The file store is the correct CI fallback and is
  # explicitly tested as a first-class path in spelunk-core's secret_store
  # tests. Integration tests (backend_kind_diagnostic) inherit this env var
  # automatically via the cargo test subprocess.
  SPELUNK_SECRET_STORE: file

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # clippy/check/build in this job need no debug info from the dev
      # profile; the full workspace build (rich-formats, incl. the embedder
      # dep tree) has been observed to exhaust runner disk (ENOSPC) with debug
      # info on. Mirrors CARGO_PROFILE_TEST_DEBUG below.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Git isolation lint
        run: scripts/check-git-isolation.sh

      - name: Disk usage (baseline)
        run: df -h

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Disk usage (after cache restore)
        run: df -h

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # --lib --bins --tests --benches (not --all-targets): examples are never
      # part of the regular build/lint/test gates. Several examples
      # (chunk_quality_eval, embed_bench) directly depend on the native
      # embedder and are meant to be run explicitly with the right features,
      # not swept in by a workspace-wide command that doesn't grant them.
      - name: Clippy (rich-formats)
        run: cargo clippy --lib --bins --tests --benches --features rich-formats -- -D warnings

      - name: Check (rich-formats)
        run: cargo check --lib --bins --tests --benches --features rich-formats

      - name: Build (rich-formats)
        run: cargo build --lib --bins --tests --benches --features rich-formats

      - name: Disk usage (after build)
        if: always()
        run: df -h

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # Test binaries don't need full debug info; this shrinks compile times
      # and cache size for this job without affecting check/build.
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux builds the native embedder (candle F2LLM) so the
            # `embed-native` path stays under test on at least one platform.
            test-flags: ""
          - os: macos-latest
            # macOS drops the server's `embed-native` feature: this builds the
            # external-endpoint-only server (no hf-hub download path, no candle
            # in spelunk-server) and keeps that config under test. Note candle is
            # now an unconditional dep of the spelunk-embed crate, so its native
            # embedder still compiles here as a workspace member. The embedder is
            # EXPERIMENTAL / NOT RECOMMENDED.
            test-flags: "--no-default-features"
          - os: windows-latest
            # Windows keeps default features: the embed-native default builds
            # the candle (CPU) embedder, which links cleanly. The spelunk-server
            # tests use embedder: None and never load the model.
            test-flags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      # Windows real-time antimalware scanning, not Windows itself, is what
      # makes this leg the slowest job in CI. On one run the same 2187 tests
      # summed to 364s of per-test time on Linux and 3694s here, and the gap
      # tracks I/O, not compute: `spelunk-server`'s in-process tests cost
      # 0.09s on Linux and 0.11s here, while the CLI integration tests that
      # spawn the freshly built, unsigned `spelunk.exe` and build git repos
      # and SQLite databases under the temp dir run 100x slower or worse
      # (`dep_question_is_never_surfaced_cross_project`: 0.09s against 45.8s
      # for roughly two process spawns). Every spawn of an unscanned binary
      # and every file those tests write is scanned, and nextest runs one
      # worker per core, so the scans pile up.
      #
      # Only the paths CI creates are excluded: the workspace, the cargo and
      # rustup homes, and the temp dirs the suite writes into. Scanning stays
      # on for everything else the runner touches, including anything fetched
      # from the network.
      #
      # Non-fatal by design. The cmdlet is absent on images without Defender
      # and tamper protection can refuse the change; a slow job beats a job
      # that fails on an unrelated platform detail.
      - name: Exclude CI paths from antimalware real-time scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command Add-MpPreference -ErrorAction SilentlyContinue)) {
            Write-Host 'Add-MpPreference is unavailable; leaving scanning settings untouched.'
            exit 0
          }

          try {
            $status = Get-MpComputerStatus
            Write-Host "before: RealTimeProtectionEnabled=$($status.RealTimeProtectionEnabled) AntivirusEnabled=$($status.AntivirusEnabled) AMRunningMode=$($status.AMRunningMode)"
          } catch {
            Write-Host "Get-MpComputerStatus failed: $($_.Exception.Message)"
          }

          # $env:TEMP can carry an 8.3 short name, which an exclusion path does
          # not match, so the long form is listed alongside it.
          $paths = @(
            $env:GITHUB_WORKSPACE
            $env:RUNNER_TEMP
            $env:TEMP
            "$env:USERPROFILE\AppData\Local\Temp"
            "$env:USERPROFILE\.cargo"
            "$env:USERPROFILE\.rustup"
          ) | Where-Object { $_ } | Select-Object -Unique

          foreach ($path in $paths) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "excluded: $path"
            } catch {
              Write-Host "could not exclude ${path}: $($_.Exception.Message)"
            }
          }

          try {
            Write-Host "exclusions now: $((Get-MpPreference).ExclusionPath -join '; ')"
          } catch {
            Write-Host "Get-MpPreference failed: $($_.Exception.Message)"
          }

      # One command per step: this job's matrix includes windows-latest, and a
      # Windows step's exit status does not reflect a failing native
      # executable (only a failing PowerShell cmdlet), so chaining two rustup
      # invocations in one run block would mask a failure in the first.
      - name: Update stable toolchain
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `-v3` bump abandons the pre-2026-07-31 caches, which still carry
          # `target/` artifacts for candle/candle-transformers linked into
          # spelunk-cli (whole extra test binaries, on Windows a full
          # companion `.pdb` per binary) from before that dependency edge was
          # dropped: spelunk-cli now only reaches the embedder over HTTP. The
          # `Cargo.lock` change that dropped it wasn't enough on its own to
          # shed those artifacts, because `restore-keys` matches on prefix:
          # every run kept rehydrating the same bloated `target/` and layering
          # new output on top of it, since cargo has no built-in GC for
          # artifacts of a dependency edge that no longer exists. Same reason
          # as the earlier `-v1` -> `-v2` bump (poisoned macOS native-embedder
          # caches): jump the prefix so restore-keys can't fall back into what
          # it's meant to abandon.
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v3-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-nextest

      # --lib --bins --tests --benches (not the nextest default, which also
      # builds examples): examples are never part of the regular test gate,
      # see the Check & Lint job's Clippy step comment above.
      - name: Run tests
        run: cargo nextest run --lib --bins --tests --benches ${{ matrix.test-flags }}

      - name: Run doctests
        run: cargo test --doc ${{ matrix.test-flags }}

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The packaging scripts only otherwise run at release-tag time, where a
      # break is expensive. node:test is a builtin: nothing to install.
      - name: Test packaging scripts
        run: node --test .github/scripts/write-deb-control.test.js

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The image compiles the release server (candle embedder) from scratch with
    # no cargo cache, so allow a generous ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spelunk-server:ci .

      # Assert the image ships the REAL server, not a placeholder: a no-op
      # binary exits 0 on every flag, so check for actual OUTPUT. Running the
      # binary also resolves every NEEDED shared lib at load, guarding the
      # runtime stage's lib set (a `docker build` alone never runs it).
      - name: Smoke-test the image
        run: |
          test -n "$(docker run --rm spelunk-server:ci --version)"
          docker run --rm spelunk-server:ci --print-openapi | head -c1 | grep -q .

      # Regression check for the container-user-has-no-home bug: start the
      # image against a real named volume (as a deployment would) and poll
      # `/v1/health` from a sidecar sharing its network namespace (the
      # pattern documented at the top of the Dockerfile, since the server
      # only binds loopback). This only needs the embedder's model-cache
      # `mkdir` to succeed, not the full ~339 MB download: `create_dir_all`
      # runs before any network I/O in `load_from_hub()`, so a cache-dir
      # failure surfaces as an `unavailable` state within a couple of
      # seconds, well before "loading" would ever complete.
      - name: Check embedder initializes against the persistent volume
        run: |
          docker run -d --name spelunk-server-ci -v spelunk-data-ci:/data spelunk-server:ci
          trap 'docker logs spelunk-server-ci || true; docker rm -f spelunk-server-ci >/dev/null 2>&1; docker volume rm spelunk-data-ci >/dev/null 2>&1' EXIT

          health=""
          for _ in $(seq 1 30); do
            health="$(docker run --rm --network container:spelunk-server-ci curlimages/curl -s http://127.0.0.1:7777/v1/health || true)"
            [ -n "$health" ] && break
            sleep 1
          done

          if [ -z "$health" ]; then
            echo "ERROR: /v1/health never answered"
            exit 1
          fi
          echo "$health"

          state="$(echo "$health" | jq -r '.embedder.state')"
          detail_lower="$(echo "$health" | jq -r '.embedder.detail // empty' | tr '[:upper:]' '[:lower:]')"

          if [ "$state" = "unavailable" ]; then
            case "$detail_lower" in
              *mkdir*|*"permission denied"*)
                echo "ERROR: embedder failed to initialize (model-cache dir/permissions failure): $detail_lower"
                exit 1
                ;;
            esac
          fi

  openapi-snapshot:
    name: OpenAPI snapshot check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate OpenAPI spec
        run: cargo run -p spelunk-server -- --print-openapi > /tmp/openapi-generated.json

      - name: Diff against committed snapshot
        run: |
          if ! diff -w -u docs/openapi.json /tmp/openapi-generated.json; then
            echo ""
            echo "ERROR: docs/openapi.json is out of date."
            echo "Run: cargo run -p spelunk-server -- --print-openapi > docs/openapi.json"
            echo "Then commit the updated snapshot."
            exit 1
          fi
